version: '3.8'
services:
  ocr-service:
    build:
      context: ./services/ocr
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./.shared:/shared

  web:
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - OCR_API_URL=http://ocr-service:8000
    command: bash -c "npm install && npm run dev"
    depends_on:
      - ocr-service
